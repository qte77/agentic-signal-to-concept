name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv run pytest
      - name: Verify sourcing in checked-in findings/candidates
        run: |
          shopt -s nullglob
          files=(examples/*/*findings*.md candidates/*-candidate.md)
          if [ ${#files[@]} -gt 0 ]; then
            uv run python scripts/verify_sourcing.py "${files[@]}"
          else
            echo "No findings/candidate files to verify yet."
          fi
